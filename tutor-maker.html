<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學模板製作工具</title>
    <link rel="stylesheet" href="tutor-maker.css">
</head>
<body>

    <div class="container">
        <h1>教學模板製作工具</h1>
        <p class="description">請填寫以下欄位來產生您的教學頁面。</p>

        <div class="main-title-section">
            <input type="text" id="main-title" placeholder="請輸入大標題 (例如：LINE WORKS 字體放大教學)">
            <input type="text" id="main-subtitle" placeholder="請輸入副標題 (例如：別擔心！跟著圖片一步一步操作，很簡單的！)">
        </div>

        <div id="editor-container">
            <!-- 教學區塊將會被插入到這裡 -->
        </div>

        <div class="controls">
            <button id="add-block-btn">＋ 新增區塊</button>
            <button id="generate-btn">產出網頁</button>
        </div>
    </div>

    <!-- 教學區塊的 HTML 模板 -->
    <template id="block-template">
        <div class="block">
            <button class="delete-block-btn" title="刪除此區塊">×</button>
            <input type="text" class="block-title" placeholder="步驟標題 (例如：第一步：找到「設定」按鈕)">
            <textarea class="block-content" rows="3" placeholder="步驟內文 (例如：打開 LINE WORKS，點一下右下角長得像「齒輪⚙️」的圖案。)"></textarea>
            <div class="image-upload-wrapper">
                <label class="image-upload-label">上傳圖片</label>
                <input type="file" class="block-image-input" accept="image/*">
                <img class="image-preview" src="" alt="圖片預覽" style="display: none;">
            </div>
        </div>
    </template>

    <script src="tutor-maker.js"></script>
</body>
</html>
